[package]
name = "stefans-utils"
version = "0.1.0"
edition = "2024"
description = "A collection of useful Rust utility functions, types, and traits."
license = "MIT"

[dependencies]
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sqlx = { version = "0.8", default-features = false, optional = true }
thiserror = "2"

[features]
default = ["serde", "schemars"]

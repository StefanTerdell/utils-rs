[package]
name = "stefans-utils"
version = "0.7.0"
edition = "2024"
description = "A collection of useful Rust utility functions, types, and traits."
license = "MIT"

[dependencies]
indexmap = { version = "2", optional = true }
paste = "1.0.15"
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sqlx = { version = "0.8", default-features = false, optional = true }
thiserror = "2"

[features]
default = ["serde", "schemars", "indexmap"]
serde = ["dep:serde", "indexmap?/serde"]
schemars = ["dep:schemars"]
indexmap = ["dep:indexmap", "schemars?/indexmap2"]
sqlx = ["dep:sqlx"]
secret-serialize-redacted = []

[dev-dependencies]
pretty_assertions = "1.4.1"
serde-nested-json = "0.1.3"
serde_json = "1"
